name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, the rebase -o / --allow-new change, and newest.
        jj: ["0.27.0", "0.36.0", "0.46.0"]
    name: test (jj ${{ matrix.jj }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          jj-version: ${{ matrix.jj }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
