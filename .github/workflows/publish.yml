# Publishes to the VS Code Marketplace (and Open VSX if configured) when a
# version tag is pushed, e.g. `jj tag set v0.1.0 -r main && jj git push --tag v0.1.0`
# (or `git tag v0.1.0 && git push origin v0.1.0`).
#
# Marketplace authentication, in order of preference:
#   1. Microsoft Entra ID (no stored secret). Repo variables:
#        AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#      for a user-assigned managed identity with a federated credential for
#      subject `repo:Brandon2255p/visual-jujutsu:environment:marketplace`, added
#      as a Contributor on the Marketplace publisher. Run this workflow manually
#      with "show_identity" checked to print the ID to add to the publisher.
#   2. Personal Access Token: repo secret VSCE_PAT (global PATs are retired by
#      Azure DevOps on 2026-12-01).
# Optional: OVSX_PAT secret for Open VSX; PRE_RELEASE variable set to "false"
# for a regular release (default is pre-release).
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      show_identity:
        description: "Only print the managed identity's Marketplace ID (one-time setup)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # for Entra ID (OIDC) login

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      USE_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Azure login (Entra ID)
        if: env.USE_ENTRA == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Print managed identity ID for the Marketplace publisher
        if: inputs.show_identity
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      - uses: actions/checkout@v4
        if: ${{ !inputs.show_identity }}
      - uses: ./.github/actions/setup
        if: ${{ !inputs.show_identity }}

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Test
        if: ${{ !inputs.show_identity }}
        run: npm run typecheck && npm test

      - name: Package
        if: ${{ !inputs.show_identity }}
        run: |
          flags="--no-dependencies"
          if [ "${{ vars.PRE_RELEASE }}" != "false" ]; then flags="$flags --pre-release"; fi
          npx @vscode/vsce package $flags -o visual-jujutsu.vsix

      # The pre-release flag is recorded in the .vsix, so publishing it needs no flags.
      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.show_identity }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          id=$(node -p "const p=require('./package.json'); p.publisher + '.' + p.name")
          version=$(node -p "require('./package.json').version")
          if npx @vscode/vsce show "$id" --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.exit(JSON.parse(s).versions.some(v=>v.version===process.argv[1])?0:1))" "$version"; then
            echo "$id $version is already on the Marketplace; skipping."
          elif [ "$USE_ENTRA" = "true" ]; then
            npx @vscode/vsce publish --azure-credential --packagePath visual-jujutsu.vsix
          elif [ -n "$VSCE_PAT" ]; then
            npx @vscode/vsce publish --packagePath visual-jujutsu.vsix
          else
            echo "No Marketplace credentials: set the AZURE_* variables or the VSCE_PAT secret." >&2
            exit 1
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ !inputs.show_identity && env.OVSX_PAT != '' }}
        run: npx ovsx publish visual-jujutsu.vsix

      - name: Attach .vsix to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "${{ vars.PRE_RELEASE }}" != "false" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" visual-jujutsu.vsix --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md $prerelease
