name: Setup
description: Install Node dependencies and jj
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    - name: Install jj
      shell: bash
      env:
        JJ_VERSION: "0.46.0"
      run: |
        curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /usr/local/bin ./jj
        jj --version
        jj config set --user user.name "CI"
        jj config set --user user.email "ci@example.com"
